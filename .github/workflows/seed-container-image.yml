name: Build seed container image

# Builds Dockerfile.seeds and pushes it to the Cloudflare managed registry, so
# no laptop needs a Docker daemon. Without this, `wrangler deploy` builds the
# image locally and fails with "The Docker CLI is needed to build the configured
# image before deploying (even in dry-run mode) but could not be launched."
#
# This job does NOT deploy. It publishes the image; `wrangler deploy` still runs
# from a laptop, and with a pre-built image reference it needs no Docker.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN  — token with Workers Scripts:Edit on account
#                           3e2617436093fffd3446428537e90efd.
#   CLOUDFLARE_ACCOUNT_ID — that same account ID.

on:
  push:
    branches: [main]
    # Mirrors the path list in scripts/seed-image-tag.sh, which is what the tag
    # is computed from. A path that changes the tag but does not appear here
    # would leave wrangler.jsonc pointing at an image nobody built.
    paths:
      - 'Dockerfile.seeds'
      - '.dockerignore'
      - 'scripts/**'
      - 'server/**'
      - 'shared/**'
      - 'data/**'
      - 'worker/counters/**'
      - 'tsconfig.json'
      - 'tsconfig.api.json'
      - '.github/workflows/seed-container-image.yml'
      # wrangler.jsonc does not feed the tag, but it is where the tag is
      # corrected. On 2026-08-06 a commit changed scripts/ without moving the
      # tag: this workflow ran, failed the check below, and the fix landed in a
      # later commit that touched wrangler.jsonc alone — which matched nothing
      # here, so the image for the current tag was never built and the failed
      # run stayed the last word. Watching this file makes the correction
      # rebuild the image.
      - 'wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push:
    name: Build and push to the Cloudflare registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Compute the image tag
        id: tag
        run: echo "tag=$(./scripts/seed-image-tag.sh)" >> "$GITHUB_OUTPUT"

      - name: Check wrangler.jsonc points at this tag
        # A mismatch means the deployed Worker would reference an image this run
        # never built. tests/worker/seed-image-tag.test.mts catches it earlier;
        # this repeats the check because a push can land without the suite.
        # Reads the account from the secret rather than hardcoding it, so a
        # wrong account fails here instead of pushing to one registry and
        # deploying from another.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e '
            const fs = require("node:fs");
            const raw = fs.readFileSync("wrangler.jsonc", "utf8");
            const config = JSON.parse(raw.replace(/^\s*\/\/.*$/gm, ""));
            const image = config.containers[0].image;
            const want = `registry.cloudflare.com/${process.env.CLOUDFLARE_ACCOUNT_ID}/worldmonitor-seeds:${process.env.TAG}`;
            if (image !== want) {
              console.error(`wrangler.jsonc image is ${image}, expected ${want}`);
              process.exit(1);
            }
            console.log(`image reference matches: ${image}`);
          '

      - name: Build the image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        # linux/amd64 is the only architecture Cloudflare Containers run.
        # --provenance=false matches what `wrangler containers build` passes;
        # an attestation manifest makes the push a multi-arch index Cloudflare
        # will not accept.
        run: |
          docker build \
            --platform linux/amd64 \
            --provenance=false \
            -f Dockerfile.seeds \
            -t "worldmonitor-seeds:${TAG}" \
            .

      - name: Push to the Cloudflare registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ steps.tag.outputs.tag }}
        # Wrangler reads wrangler.jsonc from the repo root, and that config
        # names ./dist as its assets directory. The directory is a build output
        # and is absent here; wrangler refuses to load a config whose assets
        # directory is missing, so create an empty one for the config parse.
        run: |
          mkdir -p dist
          npx --yes wrangler@4.118.0 containers push "worldmonitor-seeds:${TAG}"
